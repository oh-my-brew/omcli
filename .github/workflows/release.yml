name: Promote approved beta

on:
  workflow_dispatch:
    inputs:
      beta_tag:
        description: Exact user-approved vVERSION-beta.N tag
        required: true
        type: string
      expected_sha256:
        description: Exact SHA-256 approved together with the beta tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    uses: oh-my-infra/brew-ci/.github/workflows/promote-source-beta.yml@015379454d65f55637215ecedc19ad0bdd91a9c9
    with:
      automation-ref: 015379454d65f55637215ecedc19ad0bdd91a9c9
      beta-tag: ${{ inputs.beta_tag }}
      expected-sha256: ${{ inputs.expected_sha256 }}
      runner: macos-26
      project-name: omcli
