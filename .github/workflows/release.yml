name: Promote approved beta

on:
  workflow_dispatch:
    inputs:
      beta_tag:
        description: Exact user-approved vVERSION-beta.N tag
        required: true
        type: string
      expected_sha256:
        description: Exact SHA-256 approved together with the beta tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-candidate:
    runs-on: macos-26
    steps:
      - name: Reject invalidated candidates
        env:
          BETA_TAG: ${{ inputs.beta_tag }}
        run: |
          if [[ "$BETA_TAG" == v2026.10.19.1-beta.1 ]]; then
            echo "$BETA_TAG was invalidated because its tag targeted the wrong source commit." >&2
            exit 1
          fi

  promote:
    needs: validate-candidate
    uses: oh-my-infra/brew-ci/.github/workflows/promote-source-beta.yml@6e26fbaf6abe40fa277497a0b68d44c90ee02297
    with:
      automation-ref: 6e26fbaf6abe40fa277497a0b68d44c90ee02297
      beta-tag: ${{ inputs.beta_tag }}
      expected-sha256: ${{ inputs.expected_sha256 }}
      runner: macos-26
      project-name: omcli
